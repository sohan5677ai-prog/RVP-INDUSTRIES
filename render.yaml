services:
  - type: web
    name: rvp-server
    autoDeploy: true
    runtime: node
    plan: starter
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run build
    # The Supabase DB is provisioned directly from a full `prisma db push` +
    # data load (not the stale migration history), so we do NOT run migrations
    # on boot - that would conflict with the live schema. Apply future schema
    # changes with `prisma db push` against Supabase, matching the dev workflow.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: invoices
      - key: SLACK_ENABLED
        value: "false"
      # WhatsApp via Fast2SMS (shared KNM Multi ERP business number).
      # Test mode defaults ON in code - set WHATSAPP_TEST_MODE=false only after
      # the whole pipeline has been verified against WHATSAPP_TEST_NUMBER.
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_TEST_MODE
        value: "true"
      - key: WHATSAPP_TEST_NUMBER
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_PHONE_NUMBER_ID
        sync: false
      # 40-char secret from Dev API → webhook signing. When set, the public
      # /webhooks/whatsapp endpoint requires it back in the webhook_secret_key
      # header. Leave unset to accept unsigned calls.
      - key: FAST2SMS_WEBHOOK_SECRET
        sync: false
      # Numeric Fast2SMS message_id of each approved template (from the panel).
      - key: FAST2SMS_TMPL_PO_CREATED
        sync: false
      - key: FAST2SMS_TMPL_STOCKIN_CONFIRMED
        sync: false
      - key: FAST2SMS_TMPL_PAYMENT_SENT
        sync: false
      - key: FAST2SMS_TMPL_DISPATCH_PARTY
        sync: false
      - key: FAST2SMS_TMPL_DISPATCH_PARTY_BROKER
        sync: false
      - key: FAST2SMS_TMPL_DISPATCH_BROKER
        sync: false
      # Inert: the driver template ("driver_industries", message id 28540) has a
      # LOCATION header, which only the name-addressed POST send can fill, so its
      # numeric message_id is never used. Kept so the panel id has a home.
      - key: FAST2SMS_TMPL_DISPATCH_DRIVER
        sync: false
      # The name the driver send actually goes out on - defaults to
      # "driver_industries" in whatsapp.service.ts. Set only if it is renamed.
      # It must be approved under the number FAST2SMS_PHONE_NUMBER_ID points at;
      # /check-driver-template reports the mismatch when it isn't.
      - key: FAST2SMS_TMPL_NAME_DISPATCH_DRIVER
        sync: false
      - key: FAST2SMS_TMPL_REMINDER
        sync: false
      - key: FAST2SMS_TMPL_PAYMENT_REMINDER
        sync: false
      # Party account statement sent from the ledger's "WhatsApp Ledger" button.
      # Document header (the statement PDF) + 5 body variables.
      # Also reused as-is for the Brokerage Report's "WhatsApp Ledger" send
      # (broker statement) - see docs/whatsapp-broker-ledger-template.md.
      - key: FAST2SMS_TMPL_PARTY_LEDGER
        sync: false
      - key: FAST2SMS_TMPL_VERIFICATION_STATEMENT
        sync: false
      - key: FAST2SMS_TMPL_PAYMENT_SENT_TEXT
        sync: false
      - key: FAST2SMS_TMPL_RECEIPT_RECEIVED
        sync: false
      - key: FAST2SMS_TMPL_OWNER_DISPATCH_REMINDER
        sync: false
      - key: FAST2SMS_TMPL_OWNER_WEEKLY_SUMMARY
        sync: false
      - key: FAST2SMS_TMPL_OWNER_DUES_DIGEST
        sync: false
      - key: FAST2SMS_TMPL_OWNER_DUE_TODAY_DIGEST
        sync: false
      - key: FAST2SMS_TMPL_OWNER_BUSINESS_SNAPSHOT
        sync: false
      # Scheduled WhatsApp jobs (owner/party reminders): daily 09:00 IST dues
      # digest + buyer dues reminders + 2-day dispatch reminders, weekly Mon
      # 08:00 IST summary. Alerts go to Settings -> WhatsApp alert recipients.
      - key: WHATSAPP_CRON_ENABLED
        value: "true"
      # Shared secret for the public /webhooks/whatsapp/jobs/:job cron endpoints.
      - key: CRON_SECRET
        sync: false
