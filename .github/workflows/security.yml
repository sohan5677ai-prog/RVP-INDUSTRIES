name: security

# Dependency audit and secret scan. Added in Phase 6a of SECURITY_PLAN.md
# (item 6.9), tightened in Phase 6b. This workflow only reports and gates; it
# does not build or deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production dependencies are clean here, so a new high/critical
          # finding fails the build.
          - workspace: client
            gate_production: true
          # Still carries zod, qs, uuid and xlsx findings in production deps.
          # zod needs a 3 -> 4 major (the client is already on 4); xlsx has no
          # fixed version on npm at all, since SheetJS publishes elsewhere now.
          # Until those two are dealt with this can only report.
          # TODO: flip gate_production to true once zod and xlsx are resolved.
          - workspace: server
            gate_production: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      # No `npm ci` and no build: the audit reads the lockfile, so installing
      # is unnecessary and would make this job minutes slower.

      # What actually ships. This is the one that gates.
      - name: npm audit - production dependencies
        continue-on-error: ${{ matrix.gate_production != true }}
        working-directory: ${{ matrix.workspace }}
        run: npm audit --omit=dev --audit-level=high

      # Includes the toolchain (vitest, vite, prisma CLI). Advisory: a dev-only
      # finding is not a reason to block a deploy, but it should be visible.
      - name: npm audit - all dependencies (advisory)
        continue-on-error: true
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the worktree.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
