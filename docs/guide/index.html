<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RVP Industries ERP — User Guide</title>
  <meta name="description" content="Comprehensive user guide for the RVP Industries Tamarind Processing ERP. Every page, button, and option explained with annotated screenshots." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       DESIGN TOKENS
       ═══════════════════════════════════════════════════════════════════ */
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Spacing */
      --sidebar-w: 280px;
      --topbar-h: 64px;

      /* Annotation marker */
      --marker-size: 32px;

      /* Transitions */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark theme (default) */
    [data-theme="dark"] {
      --bg: #0a0a0f;
      --bg-card: #111118;
      --bg-sidebar: #0d0d14;
      --bg-topbar: #111118;
      --bg-hover: rgba(255,255,255,0.04);
      --bg-active: rgba(217,158,55,0.12);
      --bg-tooltip: #1a1a24;
      --bg-search: #161620;
      --bg-badge: rgba(217,158,55,0.15);
      --border: rgba(255,255,255,0.08);
      --border-active: rgba(217,158,55,0.4);
      --text: #e8e8ed;
      --text-secondary: #9898a8;
      --text-muted: #5a5a6e;
      --accent: #d99e37;
      --accent-glow: rgba(217,158,55,0.35);
      --accent-subtle: rgba(217,158,55,0.08);
      --danger: #ef4444;
      --success: #22c55e;
      --info: #3b82f6;
      --marker-bg: #d99e37;
      --marker-text: #0a0a0f;
      --marker-ring: rgba(217,158,55,0.3);
      --screenshot-shadow: 0 8px 40px rgba(0,0,0,0.5);
      --screenshot-border: rgba(255,255,255,0.06);
      --overlay-bg: rgba(0,0,0,0.7);
    }

    /* Light theme */
    [data-theme="light"] {
      --bg: #f5f5f7;
      --bg-card: #ffffff;
      --bg-sidebar: #fafafa;
      --bg-topbar: #ffffff;
      --bg-hover: rgba(0,0,0,0.03);
      --bg-active: rgba(180,120,20,0.08);
      --bg-tooltip: #ffffff;
      --bg-search: #f0f0f4;
      --bg-badge: rgba(180,120,20,0.1);
      --border: rgba(0,0,0,0.08);
      --border-active: rgba(180,120,20,0.4);
      --text: #1a1a2e;
      --text-secondary: #64648a;
      --text-muted: #9898a8;
      --accent: #b47814;
      --accent-glow: rgba(180,120,20,0.25);
      --accent-subtle: rgba(180,120,20,0.06);
      --danger: #dc2626;
      --success: #16a34a;
      --info: #2563eb;
      --marker-bg: #b47814;
      --marker-text: #ffffff;
      --marker-ring: rgba(180,120,20,0.25);
      --screenshot-shadow: 0 8px 40px rgba(0,0,0,0.1);
      --screenshot-border: rgba(0,0,0,0.08);
      --overlay-bg: rgba(255,255,255,0.85);
    }

    /* ═══════════════════════════════════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--topbar-h) + 24px);
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    img { max-width: 100%; height: auto; display: block; }

    ::selection {
      background: var(--accent);
      color: var(--marker-text);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    /* ═══════════════════════════════════════════════════════════════════
       LAYOUT
       ═══════════════════════════════════════════════════════════════════ */
    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s var(--ease);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #d99e37, #a87420);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(217,158,55,0.3);
    }

    .sidebar-brand-text {
      min-width: 0;
    }

    .sidebar-brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      white-space: nowrap;
    }

    .sidebar-brand-text p {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .sidebar-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-search input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-search);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .sidebar-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .sidebar-search input::placeholder {
      color: var(--text-muted);
    }

    .sidebar-search-wrap {
      position: relative;
    }

    .sidebar-search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 24px;
    }

    .nav-section {
      margin-bottom: 4px;
    }

    .nav-section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.2s var(--ease), background 0.2s var(--ease);
      user-select: none;
    }

    .nav-section-heading:hover {
      color: var(--text-secondary);
      background: var(--bg-hover);
    }

    .nav-section-heading.active {
      color: var(--accent);
    }

    .nav-section-heading .chevron {
      width: 14px;
      height: 14px;
      transition: transform 0.2s var(--ease);
    }

    .nav-section-heading.open .chevron {
      transform: rotate(90deg);
    }

    .nav-section-items {
      display: none;
      margin-left: 16px;
      padding-left: 12px;
      border-left: 1.5px solid var(--border);
    }

    .nav-section-items.open {
      display: block;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s var(--ease);
      position: relative;
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .nav-item.active {
      color: var(--text);
      background: var(--bg-active);
      font-weight: 600;
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: -13px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .nav-item-badge {
      margin-left: auto;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      background: var(--bg-badge);
      color: var(--accent);
    }

    .nav-item.hidden { display: none; }

    /* ── Topbar ──────────────────────────────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0;
      left: var(--sidebar-w);
      right: 0;
      height: var(--topbar-h);
      background: var(--bg-topbar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 90;
      backdrop-filter: blur(12px);
    }

    .topbar-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .topbar-section {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
    }

    .topbar-section::after {
      content: '/';
      margin-left: 10px;
      color: var(--border);
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s var(--ease);
    }

    .topbar-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-active);
    }

    .topbar-btn svg { width: 18px; height: 18px; }

    .menu-btn {
      display: none;
    }

    /* ── Main Content ────────────────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      padding-top: var(--topbar-h);
      flex: 1;
      min-width: 0;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    /* ═══════════════════════════════════════════════════════════════════
       PAGE SECTIONS
       ═══════════════════════════════════════════════════════════════════ */
    .guide-section {
      margin-bottom: 80px;
      animation: fadeInUp 0.5s var(--ease) both;
    }

    .guide-section:target {
      scroll-margin-top: calc(var(--topbar-h) + 24px);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      margin-bottom: 24px;
    }

    .section-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: var(--bg-badge);
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .section-desc {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 680px;
      line-height: 1.7;
    }

    .section-route {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    /* ── Screenshot Container ───────────────────────────────────────── */
    .screenshot-wrap {
      position: relative;
      margin: 32px 0;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--screenshot-border);
      box-shadow: var(--screenshot-shadow);
      background: var(--bg-card);
    }

    .screenshot-wrap img {
      width: 100%;
      display: block;
    }

    .screenshot-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, var(--bg-card), var(--bg));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    /* ── Annotation Markers ─────────────────────────────────────────── */
    .annotation-markers {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      width: var(--marker-size);
      height: var(--marker-size);
      border-radius: 50%;
      background: var(--marker-bg);
      color: var(--marker-text);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: all;
      box-shadow: 0 2px 8px var(--accent-glow), 0 0 0 3px var(--marker-ring);
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      z-index: 5;
      transform: translate(-50%, -50%);
    }

    .marker:hover {
      transform: translate(-50%, -50%) scale(1.2);
      box-shadow: 0 4px 16px var(--accent-glow), 0 0 0 5px var(--marker-ring);
      z-index: 10;
    }

    .marker.active {
      transform: translate(-50%, -50%) scale(1.25);
      box-shadow: 0 4px 20px var(--accent-glow), 0 0 0 6px var(--marker-ring);
      z-index: 10;
    }

    .marker-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--marker-bg);
      opacity: 0;
      animation: markerPulse 2s var(--ease) infinite;
    }

    @keyframes markerPulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ── Annotation Tooltip ─────────────────────────────────────────── */
    .marker-tooltip {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      width: 260px;
      padding: 14px 16px;
      background: var(--bg-tooltip);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s var(--ease);
      z-index: 20;
      pointer-events: none;
    }

    .marker:hover .marker-tooltip,
    .marker.active .marker-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: all;
    }

    .marker-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--bg-tooltip);
    }

    .marker-tooltip-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .marker-tooltip-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .marker-tooltip-type {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 4px;
    }

    .marker-tooltip-type.button { background: rgba(59,130,246,0.15); color: var(--info); }
    .marker-tooltip-type.field { background: rgba(34,197,94,0.15); color: var(--success); }
    .marker-tooltip-type.display { background: rgba(168,116,32,0.15); color: var(--accent); }
    .marker-tooltip-type.section { background: rgba(148,163,184,0.15); color: var(--text-secondary); }
    .marker-tooltip-type.danger { background: rgba(239,68,68,0.15); color: var(--danger); }

    /* ── Annotation Legend (Below Screenshot) ───────────────────────── */
    .annotation-list {
      margin-top: 24px;
    }

    .annotation-list-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .annotation-list-title svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .annotation-item {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: all 0.15s var(--ease);
      cursor: pointer;
    }

    .annotation-item:hover,
    .annotation-item.active {
      background: var(--bg-hover);
      border-color: var(--border);
    }

    .annotation-item-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--marker-bg);
      color: var(--marker-text);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .annotation-item-content { flex: 1; min-width: 0; }

    .annotation-item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .annotation-item-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ── Workflow Tips ───────────────────────────────────────────────── */
    .workflow-box {
      margin-top: 24px;
      padding: 20px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--accent-subtle);
    }

    .workflow-box h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .workflow-box h4 svg { width: 16px; height: 16px; }

    .workflow-box p,
    .workflow-box li {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .workflow-box ol, .workflow-box ul {
      padding-left: 20px;
      margin-top: 8px;
    }

    .workflow-box li { margin-bottom: 4px; }

    /* ── Keyboard Shortcut Badges ───────────────────────────────────── */
    kbd {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 1px 0 var(--border);
    }

    /* ═══════════════════════════════════════════════════════════════════
       PROGRESS BAR (top of page)
       ═══════════════════════════════════════════════════════════════════ */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #e8b84a);
      z-index: 200;
      transition: width 0.15s var(--ease);
    }

    /* ═══════════════════════════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════════════════════════ */
    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .topbar {
        left: 0;
      }

      .main {
        margin-left: 0;
      }

      .menu-btn {
        display: flex;
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 99;
      }

      .sidebar-overlay.open {
        display: block;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       PRINT
       ═══════════════════════════════════════════════════════════════════ */
    @media print {
      .sidebar, .topbar, .progress-bar, .topbar-actions, .menu-btn { display: none !important; }
      .main { margin-left: 0 !important; padding-top: 0 !important; }
      .content { max-width: none; padding: 20px; }
      .guide-section { break-inside: avoid; page-break-inside: avoid; margin-bottom: 40px; }
      .screenshot-wrap { box-shadow: none; border: 1px solid #ccc; }
      .marker-tooltip { display: none !important; }
      body { background: #fff; color: #000; }
    }
  </style>
</head>
<body>
  <!-- Progress bar -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="app">
    <!-- ═══════════════════════════════════════ SIDEBAR ═══════════════ -->
    <aside class="sidebar" id="sidebar">

    ];

    // ═══════════════════════════════════════════════════════════════════
    // BUILD SIDEBAR NAV
    // ═══════════════════════════════════════════════════════════════════
    function buildSidebar() {
      const nav = document.getElementById('sidebarNav');
      const sections = {};
      
      GUIDE_DATA.forEach(page => {
        if (!sections[page.section]) sections[page.section] = [];
        sections[page.section].push(page);
      });

      let html = '';
      Object.entries(sections).forEach(([section, pages]) => {
        const sectionId = section.toLowerCase().replace(/\s+/g, '-');
        html += `
          <div class="nav-section" data-section="${sectionId}">
            <div class="nav-section-heading" onclick="toggleSection(this)" data-section="${sectionId}">
              <span>${section}</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            </div>
            <div class="nav-section-items" data-section="${sectionId}">
              ${pages.map(p => `
                <div class="nav-item" data-id="${p.id}" data-title="${p.title.toLowerCase()}" onclick="scrollToSection('${p.id}')">
                  <span>${p.title}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      nav.innerHTML = html;

      // Open first section by default
      const firstHeading = nav.querySelector('.nav-section-heading');
      if (firstHeading) toggleSection(firstHeading);
    }

    // ═══════════════════════════════════════════════════════════════════
    // BUILD MAIN CONTENT
    // ═══════════════════════════════════════════════════════════════════
    function buildContent() {
      const content = document.getElementById('content');
      let html = '';

      // Hero section
      html += `
        <div style="text-align:center; margin-bottom:64px; padding: 48px 0;">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#d99e37,#a87420);margin-bottom:24px;box-shadow:0 8px 32px rgba(217,158,55,0.3);">
            <span style="font-weight:900;font-size:32px;color:#fff;">R</span>
          </div>
          <h1 style="font-size:36px;font-weight:900;letter-spacing:-0.03em;margin-bottom:8px;">RVP Industries ERP</h1>
          <p style="font-size:16px;color:var(--text-secondary);max-width:540px;margin:0 auto;">
            Complete user guide with annotated screenshots for every page, button, and option in the Tamarind Processing ERP system.
          </p>
          <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            <span style="padding:6px 14px;border-radius:8px;background:var(--bg-badge);color:var(--accent);font-size:12px;font-weight:600;">44 Pages Documented</span>
            <span style="padding:6px 14px;border-radius:8px;background:var(--bg-hover);color:var(--text-secondary);font-size:12px;font-weight:600;border:1px solid var(--border);">Interactive Annotations</span>
            <span style="padding:6px 14px;border-radius:8px;background:var(--bg-hover);color:var(--text-secondary);font-size:12px;font-weight:600;border:1px solid var(--border);">Searchable</span>
          </div>
        </div>
      `;

      let currentSection = '';

      GUIDE_DATA.forEach(page => {
        // Section divider
        if (page.section !== currentSection) {
          currentSection = page.section;
          html += `
            <div style="margin: 64px 0 32px; padding-top: 24px; border-top: 1px solid var(--border);">
              <h2 style="font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.02em;">${currentSection}</h2>
            </div>
          `;
        }

        // Markers HTML
        const markersHtml = page.annotations.map(a => `
          <div class="marker" style="left:${a.x}%;top:${a.y}%;" data-num="${a.num}" onclick="toggleMarker(this)">
            <div class="marker-pulse"></div>
            ${a.num}
            <div class="marker-tooltip">
              <div class="marker-tooltip-title">${a.title}</div>
              <div class="marker-tooltip-desc">${a.desc}</div>
              <span class="marker-tooltip-type ${a.type}">${a.type}</span>
            </div>
          </div>
        `).join('');

        // Annotation list HTML
        const annotationListHtml = page.annotations.map(a => `
          <div class="annotation-item" data-num="${a.num}" onmouseenter="highlightMarker('${page.id}', ${a.num})" onmouseleave="unhighlightMarker('${page.id}', ${a.num})">
            <div class="annotation-item-num">${a.num}</div>
            <div class="annotation-item-content">
              <div class="annotation-item-title">${a.title} <span class="marker-tooltip-type ${a.type}" style="vertical-align:middle;margin-left:6px;">${a.type}</span></div>
              <div class="annotation-item-desc">${a.desc}</div>
            </div>
          </div>
        `).join('');

        html += `
          <div class="guide-section" id="${page.id}">
            <div class="section-header">
              <div class="section-badge">${page.section}</div>
              <h3 class="section-title">${page.title}</h3>
              <p class="section-desc">${page.description}</p>
              <div class="section-route">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                ${page.route}
              </div>
            </div>

            <div class="screenshot-wrap" data-page="${page.id}">
              <img src="${page.screenshot}" alt="${page.title} screenshot" onerror="this.parentElement.innerHTML='<div class=\\'screenshot-placeholder\\'>Screenshot: ${page.title}<br><small>${page.screenshot}</small></div>'" loading="lazy" />
              <div class="annotation-markers">
                ${markersHtml}
              </div>
            </div>

            <div class="annotation-list">
              <div class="annotation-list-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                Annotations
              </div>
              ${annotationListHtml}
            </div>

            ${page.workflow ? `
              <div class="workflow-box">
                <h4>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                  How to use
                </h4>
                <p>${page.workflow}</p>
              </div>
            ` : ''}
          </div>
        `;
      });

      content.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════════════════════
    // INTERACTIONS
    // ═══════════════════════════════════════════════════════════════════
    function toggleSection(el) {
      const sectionId = el.dataset.section;
      const items = document.querySelector(`.nav-section-items[data-section="${sectionId}"]`);
      const isOpen = items.classList.contains('open');
      
      // Close all
      document.querySelectorAll('.nav-section-items').forEach(i => i.classList.remove('open'));
      document.querySelectorAll('.nav-section-heading').forEach(h => h.classList.remove('open'));
      
      if (!isOpen) {
        items.classList.add('open');
        el.classList.add('open');
      }
    }

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // Update active nav item
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelector(`.nav-item[data-id="${id}"]`)?.classList.add('active');
        // Close mobile sidebar
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
      }
    }

    function toggleMarker(el) {
      const wasActive = el.classList.contains('active');
      // Deactivate all markers in same screenshot
      el.closest('.annotation-markers').querySelectorAll('.marker').forEach(m => m.classList.remove('active'));
      if (!wasActive) el.classList.add('active');
    }

    function highlightMarker(pageId, num) {
      const wrap = document.querySelector(`.screenshot-wrap[data-page="${pageId}"]`);
      if (!wrap) return;
      const marker = wrap.querySelector(`.marker[data-num="${num}"]`);
      if (marker) marker.classList.add('active');
    }

    function unhighlightMarker(pageId, num) {
      const wrap = document.querySelector(`.screenshot-wrap[data-page="${pageId}"]`);
      if (!wrap) return;
      const marker = wrap.querySelector(`.marker[data-num="${num}"]`);
      if (marker) marker.classList.remove('active');
    }

    function filterNav(query) {
      const q = query.trim().toLowerCase();
      document.querySelectorAll('.nav-item').forEach(item => {
        const title = item.dataset.title;
        if (!q || title.includes(q)) {
          item.classList.remove('hidden');
        } else {
          item.classList.add('hidden');
        }
      });
      // Open all sections when searching
      if (q) {
        document.querySelectorAll('.nav-section-items').forEach(i => i.classList.add('open'));
        document.querySelectorAll('.nav-section-heading').forEach(h => h.classList.add('open'));
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('guide-theme', next);
      updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
      const btn = document.getElementById('themeBtn');
      btn.innerHTML = theme === 'dark'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    }

    // ── Scroll tracking ──
    function updateScrollProgress() {
      const scrolled = window.scrollY;
      const total = document.documentElement.scrollHeight - window.innerHeight;
      const pct = total > 0 ? (scrolled / total) * 100 : 0;
      document.getElementById('progressBar').style.width = pct + '%';
    }

    // ── Active section tracking ──
    function updateActiveSection() {
      const sections = document.querySelectorAll('.guide-section');
      let currentId = '';
      
      sections.forEach(section => {
        const rect = section.getBoundingClientRect();
        if (rect.top <= 120) currentId = section.id;
      });

      if (currentId) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const activeItem = document.querySelector(`.nav-item[data-id="${currentId}"]`);
        if (activeItem) {
          activeItem.classList.add('active');
          // Update topbar
          const page = GUIDE_DATA.find(p => p.id === currentId);
          if (page) {
            document.getElementById('topbarSection').textContent = page.section;
            document.getElementById('topbarTitle').textContent = page.title;
          }
          // Ensure parent section is open
          const section = activeItem.closest('.nav-section');
          if (section) {
            const heading = section.querySelector('.nav-section-heading');
            const items = section.querySelector('.nav-section-items');
            if (!items.classList.contains('open')) {
              heading.classList.add('open');
              items.classList.add('open');
            }
          }
        }
      }
    }

    // ── Init ──
    window.addEventListener('scroll', () => {
      updateScrollProgress();
      updateActiveSection();
    });

    // Restore theme
    const savedTheme = localStorage.getItem('guide-theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
    }

    // Keyboard shortcut: Ctrl+K for search
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    // Build the page
    buildSidebar();
    buildContent();
  </script>
</body>
</html>
